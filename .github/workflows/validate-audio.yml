name: Validar áudios para a Alexa

on:
  push:
    paths:
      - 'audio/**'
      - 'scripts/**'
      - '.github/workflows/validate-audio.yml'
  pull_request:
    paths:
      - 'audio/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validar requisitos da tag SSML <audio>
        run: bash scripts/validate-audio.sh
